<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Coin</title>
    <style>
        /* Base Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            background-color: #020005;
            overflow: hidden;
            background: radial-gradient(circle at center, #130024 0%, #020005 100%);
        }

        /* 3D Neon Grid Floor */
        .bg-grid {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50%;
            z-index: -1;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(600px) rotateX(70deg) translateY(100px) translateZ(-50px);
            box-shadow: inset 0 100px 100px #020005;
        }

        .ui-container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
        }

        /* Neon Glowing Header */
        .app-title {
            font-size: 2.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff00ff,
                0 0 40px #ff00ff,
                0 0 80px #ff00ff;
            margin-bottom: 0.5rem;
        }

        .status-text {
            font-size: 1.2rem;
            font-weight: 600;
            min-height: 1.5rem;
            color: #0ff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            max-width: 80%;
            line-height: 1.4;
            transition: color 0.3s, text-shadow 0.3s;
        }

        /* 3D COIN STYLING */
        .coin-container {
            perspective: 1200px;
            margin: 1.5rem 0;
        }

        .coin {
            position: relative;
            width: 220px;
            height: 220px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 2.5s cubic-bezier(0.175, 0.885, 0.32, 1.15); 
        }

        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            letter-spacing: 2px;
            backface-visibility: hidden;
            background-color: #050505;
        }

        /* Figure and Text Adjustments */
        .coin-face svg {
            width: 70px;
            height: 70px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px currentColor);
        }

        .coin-face span {
            font-size: 1.5rem;
        }

        /* Cyan Heads Face */
        .coin-front {
            border: 6px solid #0ff;
            color: #0ff;
            box-shadow: 
                inset 0 0 25px rgba(0, 255, 255, 0.4), 
                0 0 40px rgba(0, 255, 255, 0.6);
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
        }

        /* Magenta Tails Face */
        .coin-back {
            border: 6px solid #ff00ff;
            color: #ff00ff;
            box-shadow: 
                inset 0 0 25px rgba(255, 0, 255, 0.4), 
                0 0 40px rgba(255, 0, 255, 0.6);
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
            transform: rotateY(180deg);
        }

        /* Arcade Flip Button */
        .flip-btn {
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 
                0 0 10px rgba(0, 255, 255, 0.3),
                inset 0 0 10px rgba(0, 255, 255, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .flip-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 
                0 0 25px rgba(0, 255, 255, 0.9),
                0 0 50px rgba(0, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .flip-btn:active {
            transform: translateY(2px);
        }

        .flip-btn:disabled {
            border-color: #333;
            color: #555;
            box-shadow: none;
            background: transparent;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="ui-container">
        <h1 class="app-title">Lucky Coin</h1>
        
        <div id="status" class="status-text">Assign Heads (Cyan) or Tails (Magenta)...</div>
        
        <div class="coin-container" title="Tap to flip!">
            <div id="coin" class="coin">
                <div class="coin-face coin-front">
                    <!-- Standard Head / Profile Figure -->
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                    <span>Heads</span>
                </div>
                <div class="coin-face coin-back">
                    <!-- Standard Star / Tails Figure -->
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                    </svg>
                    <span>TAILS</span>
                </div>
            </div>
        </div>

        <button id="flipBtn" class="flip-btn">Flip Coin</button>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const statusText = document.getElementById('status');
        const flipBtn = document.getElementById('flipBtn');
        
        let isAnimating = false;
        let totalRotations = 0; 

        function triggerFlip() {
            if (isAnimating) return;
            isAnimating = true;
            flipBtn.disabled = true;
            
            // Initial haptic tap
            if (navigator.vibrate) navigator.vibrate(50);

            // Neutral white spinning text
            statusText.style.color = '#fff';
            statusText.style.textShadow = '0 0 10px rgba(255, 255, 255, 0.8)';
            statusText.textContent = "Spinning...";

            const isHeads = Math.random() < 0.5;
            const baseSpins = 6;
            let targetRotation = totalRotations + (baseSpins * 360);

            if (!isHeads) {
                targetRotation += 180;
            } else if (targetRotation % 360 !== 0) {
                targetRotation += 180; 
            }

            coin.style.transform = `rotateY(${targetRotation}deg)`;
            totalRotations = targetRotation;

            setTimeout(() => {
                // Match the text color to the winning face
                if (isHeads) {
                    statusText.style.color = '#0ff';
                    statusText.style.textShadow = '0 0 10px rgba(0, 255, 255, 0.8)';
                } else {
                    statusText.style.color = '#ff00ff';
                    statusText.style.textShadow = '0 0 10px rgba(255, 0, 255, 0.8)';
                }
                
                statusText.textContent = `It's ${isHeads ? 'Heads' : 'Tails'}! Ready to roll again?`;
                flipBtn.disabled = false;
                isAnimating = false;
                
                // Final haptic success burst
                if (navigator.vibrate) navigator.vibrate([30, 50, 30]);
            }, 2500); 
        }

        flipBtn.addEventListener('click', triggerFlip);
        coin.addEventListener('click', triggerFlip);
    </script>
</body>
</html>
