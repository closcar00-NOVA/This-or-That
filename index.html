<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Coin Flip</title>
    <style>
        /* Base Reset & Typography */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            background-color: #050505;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0b2e 0%, #050505 100%);
        }

        .bg-custom-asset {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        .ui-container {
            text-align: center;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            max-width: 500px;
            padding: 0 20px;
        }

        /* Neon App Header */
        .app-title {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #d8b4fe;
            text-shadow: 0 0 10px rgba(216, 180, 254, 0.6), 0 0 20px rgba(168, 85, 247, 0.4);
            margin-bottom: 0.5rem;
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 500;
            min-height: 1.5rem;
            color: #e9d5ff;
            max-width: 80%;
            line-height: 1.4;
        }

        /* 
         * 3D COIN STYLING 
         * Uses perspective to create a realistic 3D space for the flip
         */
        .coin-container {
            perspective: 1000px;
            margin: 1rem 0;
        }

        .coin {
            position: relative;
            width: 250px;
            height: 250px;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 2s cubic-bezier(0.175, 0.885, 0.32, 1.1); /* Adds a slight bounce at the end */
        }

        /* Shared styles for both faces */
        .coin-face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            backface-visibility: hidden; /* Hides the back of the element when it's rotated away */
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.5), 
                0 15px 35px rgba(0,0,0,0.6);
            border: 8px solid #b8860b;
        }

        /* Heads Face */
        .coin-front {
            background: radial-gradient(circle at 30% 30%, #ffd700 0%, #b8860b 100%);
            color: #4a3600;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
        }

        /* Tails Face */
        .coin-back {
            background: radial-gradient(circle at 30% 30%, #e5c100 0%, #996515 100%);
            color: #332500;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.4);
            transform: rotateY(180deg); /* Pre-rotated to face backwards */
        }

        /* Flip Button */
        .flip-btn {
            background-color: #9333ea;
            color: #fff;
            border: none;
            padding: 14px 32px;
            font-size: 1.2rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(147, 51, 234, 0.3);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .flip-btn:hover {
            background-color: #a855f7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.5);
        }

        .flip-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 10px rgba(147, 51, 234, 0.3);
        }

        .flip-btn:disabled {
            background-color: #333;
            color: #777;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>

    <div class="bg-custom-asset"></div>

    <div class="ui-container">
        <h1 class="app-title">The Decider</h1>
        
        <div id="status" class="status-text">Assign your choices, then tap the coin...</div>
        
        <div class="coin-container" title="Tap to flip!">
            <div id="coin" class="coin">
                <div class="coin-face coin-front">Heads</div>
                <div class="coin-face coin-back">Tails</div>
            </div>
        </div>

        <button id="flipBtn" class="flip-btn">Flip Coin</button>
    </div>

    <script>
        const coin = document.getElementById('coin');
        const statusText = document.getElementById('status');
        const flipBtn = document.getElementById('flipBtn');
        
        let isAnimating = false;
        let totalRotations = 0; // Keeps track of spins so the coin always spins forward instead of snapping back

        function triggerFlip() {
            if (isAnimating) return;
            isAnimating = true;
            flipBtn.disabled = true;
            statusText.textContent = "Flipping...";

            // Randomly choose outcome
            const isHeads = Math.random() < 0.5;
            
            // Add 5 full base spins (1800 degrees) to ensure a dynamic, long animation
            const baseSpins = 5;
            let targetRotation = totalRotations + (baseSpins * 360);

            // If it needs to land on tails, add an extra 180 degrees
            if (!isHeads) {
                targetRotation += 180;
            } else if (targetRotation % 360 !== 0) {
                // Ensure heads always lands perfectly on a multiple of 360
                targetRotation += 180; 
            }

            // Apply the CSS rotation
            coin.style.transform = `rotateY(${targetRotation}deg)`;
            totalRotations = targetRotation;

            // Wait for the 2-second CSS transition to complete
            setTimeout(() => {
                statusText.textContent = `It's ${isHeads ? 'Heads' : 'Tails'}! Ready to flip again?`;
                flipBtn.disabled = false;
                isAnimating = false;
            }, 2000); 
        }

        flipBtn.addEventListener('click', triggerFlip);
        coin.addEventListener('click', triggerFlip);
    </script>
</body>
</html>
